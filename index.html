<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>BURGER HOUSE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@900&display=swap" rel="stylesheet">
<style>body{font-family:Inter}.bebas{font-family:'Bebas Neue'}</style>
</head>
<body class="bg-[#0B0B0B] text-white pb-32">
<header class="sticky top-0 z-30 bg-black/90 backdrop-blur border-b border-white/5"><div class="max-w-[1200px] mx-auto px-4 py-3 flex justify-between items-center"><div class="flex gap-3 items-center"><div id="logoAdmin" class="w-9 h-9 bg-yellow-400 rounded-full grid place-items-center text-black font-black cursor-pointer">BH</div><p class="bebas text-xl">BURGER HOUSE</p></div><div id="mesaBadge" class="hidden bg-white text-black px-4 py-1 rounded-full text-xs font-black">MESA <span id="mesaNum"></span></div></div></header>
<main class="max-w-[1200px] mx-auto px-4"><div id="heroMesa" class="hidden mt-4 bg-yellow-400 text-black rounded-[28px] p-5 flex justify-between"><div><p class="text-[10px] font-black">VOCÊ ESTÁ NA</p><p class="bebas text-5xl">MESA <span id="heroMesaNum"></span></p></div><div class="text-5xl">🍔</div></div>
<div class="mt-6 flex gap-2 overflow-auto pb-2"><button onclick="filtrar('todos')" id="f-todos" class="bg-yellow-400 text-black px-5 py-2 rounded-full text-xs font-black">TODOS • 18</button><button onclick="filtrar('burger')" id="f-burger" class="bg-white/10 px-5 py-2 rounded-full text-xs font-bold">🍔 BURGERS</button><button onclick="filtrar('porcao')" id="f-porcao" class="bg-white/10 px-5 py-2 rounded-full text-xs font-bold">🍟 PORÇÕES</button><button onclick="filtrar('bebida')" id="f-bebida" class="bg-white/10 px-5 py-2 rounded-full text-xs font-bold">🥤 BEBIDAS</button></div>
<div id="grid" class="grid grid-cols-2 md:grid-cols-3 gap-3 mt-4"></div></main>
<div class="fixed bottom-0 left-0 right-0 p-4 bg-gradient-to-t from-black"><div class="max-w-[1200px] mx-auto"><div class="bg-white text-black rounded-[24px] p-4 flex justify-between"><div><p class="text-[10px] text-zinc-400">MESA <span id="sacolaMesa">-</span></p><p id="sacolaTotal" class="font-black">R$ 0,00 • 0 itens</p></div><button id="btnVerSacola" class="bg-black text-white px-6 py-3 rounded-full font-black text-sm">VER SACOLA</button></div></div></div>
<div id="trackingWrap" class="fixed bottom-[88px] left-0 right-0 p-4 hidden"><div class="max-w-[1200px] mx-auto"><div class="bg-[#1A1A1A] border border-yellow-400/20 rounded-[24px] p-4"><p class="font-black text-[11px] text-yellow-400">📍 SEU PEDIDO • MESA <span id="trackMesa"></span></p><div id="trackList" class="mt-3 grid gap-2"></div></div></div></div>
<div id="modalSacola" class="hidden fixed inset-0 bg-black/80 z-50 flex items-end justify-center"><div class="bg-white text-black rounded-t-[32px] w-full max-w-[480px] max-h-[92vh] flex flex-col"><div class="p-6 border-b flex justify-between"><p class="font-black text-xl">Sacola • Mesa <span id="modalMesa"></span></p><button onclick="closeSacola()" class="w-8 h-8 bg-zinc-100 rounded-full">✕</button></div><div id="carrinho" class="flex-1 overflow-auto p-4"></div><div class="p-6 border-t"><textarea id="obs" placeholder="Obs: tirar cebola..." class="w-full bg-zinc-100 p-3 rounded-2xl text-sm h-14 outline-none"></textarea><input id="nome" placeholder="Seu nome *" class="w-full mt-3 bg-zinc-100 p-4 rounded-2xl text-sm outline-none"><input id="whats" placeholder="WhatsApp *" class="w-full mt-2 bg-zinc-100 p-4 rounded-2xl text-sm outline-none"><div class="flex justify-between mt-4"><span>Total</span><span id="total" class="font-black text-2xl">R$ 0,00</span></div><button id="btnPedir" class="w-full mt-4 bg-yellow-400 text-black py-5 rounded-full font-black">🍔 ENVIAR PRA COZINHA</button></div></div></div>
<div id="modalLanche" class="hidden fixed inset-0 bg-black/90 z-[60] flex items-end justify-center"><div class="bg-[#181818] rounded-t-[32px] w-full max-w-[520px]"><img id="mFoto" class="w-full h-[300px] object-cover"><div class="p-6"><h3 id="mNome" class="bebas text-3xl"></h3><p id="mDesc" class="text-sm text-white/50"></p><p id="mPrecoBase" class="font-black text-2xl text-yellow-400 mt-2"></p><div id="mAdds" class="mt-4 grid gap-2"></div><div class="mt-4 bg-white text-black rounded-2xl p-4 flex justify-between"><span>TOTAL</span><span id="mTotal" class="font-black"></span></div><button id="mAdd" class="w-full mt-4 bg-yellow-400 text-black py-5 rounded-full font-black">ADICIONAR</button><button onclick="closeModal()" class="w-full mt-3 text-white/30 text-xs">Fechar</button></div></div></div>
<script>
const firebaseConfig={apiKey:"AIzaSyDfnlWLGHySS42WMOcve1qP-dSH3cF-J50",authDomain:"cardapiobr-be645.firebaseapp.com",projectId:"cardapiobr-be645",storageBucket:"cardapiobr-be645.firebasestorage.app",messagingSenderId:"1013095361613",appId:"1:1013095361613:web:31d58aa9ebda0135110004"};
let db;try{firebase.initializeApp(firebaseConfig);db=firebase.firestore();}catch(e){}
let mesa=new URLSearchParams(location.search).get('mesa')||localStorage.getItem('mesa')||'';let carrinho=[],detalhe=null,adds=[],pedidos=[],filtro='todos';
const cardapio=[
{nome:'WHOPPER HOUSE',preco:32,desc:'Pão brioche, blend 180g, cheddar.',foto:'https://images.unsplash.com/photo-1568909344668-6f14a07b56a0?w=600',cat:'burger'},
{nome:'CHEDDAR DUPLO',preco:42,desc:'Dois blends, cheddar e bacon.',foto:'https://images.unsplash.com/photo-1553979459-d2229ba7433b?w=600',cat:'burger'},
{nome:'BATATA TRUFADA',preco:28,desc:'350g batata, cheddar, bacon bits.',foto:'https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=600',cat:'porcao'},
{nome:'SMASH CLASSIC',preco:26,desc:'Smash 90g, cheddar, picles, cebola.',foto:'https://images.unsplash.com/photo-1561070791-2526d30994b5?w=600',cat:'burger'},
{nome:'BACON TRIPLO',preco:48,desc:'Três carnes, triplo bacon, triplo cheddar.',foto:'https://images.unsplash.com/photo-1593246049226-ded77bf90326?w=600',cat:'burger'},
{nome:'ONION MELT',preco:34,desc:'Blend 180g, cebola caramelizada, suíço.',foto:'https://images.unsplash.com/photo-1550547660-d9450f859349?w=600',cat:'burger'},
{nome:'FRANGO CRISPY',preco:30,desc:'Peito empanado crocante, maionese, alface.',foto:'https://images.unsplash.com/photo-1606756790138-261d2b21cd75?w=600',cat:'burger'},
{nome:'VEGGIE HOUSE',preco:28,desc:'Burger grão de bico, queijo, rúcula.',foto:'https://images.unsplash.com/photo-1520072959219-c595dc870360?w=600',cat:'burger'},
{nome:'COSTELA BBQ',preco:44,desc:'Burger costela 180g, onion, BBQ.',foto:'https://images.unsplash.com/photo-1594212699903-ec8a3eca50f5?w=600',cat:'burger'},
{nome:'BATATA SIMPLES',preco:18,desc:'250g batata frita crocante.',foto:'https://images.unsplash.com/photo-1585109649139-366815a0d713?w=600',cat:'porcao'},
{nome:'BATATA COM CHEDDAR',preco:24,desc:'300g batata + cheddar derretido.',foto:'https://images.unsplash.com/photo-1630384060421-cb20d0e0649d?w=600',cat:'porcao'},
{nome:'ONION RINGS',preco:22,desc:'12 anéis cebola, molho barbecue.',foto:'https://images.unsplash.com/photo-1639024471283-03518883512d?w=600',cat:'porcao'},
{nome:'NUGGETS 10UN',preco:20,desc:'10 nuggets + mostarda e mel.',foto:'https://images.unsplash.com/photo-1562967914-608f82629710?w=600',cat:'porcao'},
{nome:'COCA LATA 350ML',preco:6,desc:'Coca-Cola gelada lata.',foto:'https://images.unsplash.com/photo-1624552168657-1d2bb6298d51?w=600',cat:'bebida'},
{nome:'GUARANÁ LATA',preco:6,desc:'Guaraná Antarctica 350ml.',foto:'https://images.unsplash.com/photo-1624552168174-48a1183bc2ff?w=600',cat:'bebida'},
{nome:'ÁGUA 500ML',preco:4,desc:'Água mineral sem gás.',foto:'https://images.unsplash.com/photo-1523369364227-2498b8c533c0?w=600',cat:'bebida'},
{nome:'SUCO NATURAL',preco:8,desc:'Laranja, maracujá ou abacaxi 400ml.',foto:'https://images.unsplash.com/photo-1621506289937-a8e4df240d0b?w=600',cat:'bebida'},
{nome:'MILKSHAKE OREO',preco:16,desc:'Milkshake cremoso Oreo 400ml.',foto:'https://images.unsplash.com/photo-1579954115545-a95591f28bfc?w=600',cat:'bebida'},
];
const extras=[{nome:'Bacon Extra',preco:6},{nome:'Cheddar Extra',preco:5},{nome:'Ovo Frito',preco:4},{nome:'Cebola Caramelizada',preco:3},{nome:'Molho da Casa',preco:2},{nome:'Picles Extra',preco:2}];
if(mesa){mesa=mesa.replace(/\D/g,'');localStorage.setItem('mesa',mesa);document.getElementById('mesaBadge').classList.remove('hidden');document.getElementById('mesaNum').textContent=mesa;document.getElementById('heroMesa').classList.remove('hidden');document.getElementById('heroMesaNum').textContent=mesa;document.getElementById('sacolaMesa').textContent=mesa;document.getElementById('modalMesa').textContent=mesa;}
window.filtrar=(cat)=>{filtro=cat;document.querySelectorAll('[id^=f-]').forEach(b=>b.className='bg-white/10 px-5 py-2 rounded-full text-xs font-bold');document.getElementById('f-'+cat).className='bg-yellow-400 text-black px-5 py-2 rounded-full text-xs font-black';renderMenu();};
function renderMenu(){let lista=filtro=='todos'?cardapio:cardapio.filter(c=>c.cat==filtro);document.getElementById('grid').innerHTML=lista.map((c)=>{let i=cardapio.indexOf(c);return `<div onclick="openM(${i})" class="bg-[#161616] rounded-[22px] overflow-hidden cursor-pointer border border-white/5"><img src="${c.foto}" class="w-full h-[130px] md:h-[180px] object-cover"><div class="p-3 md:p-5"><h3 class="bebas text-[16px] md:text-xl">${c.nome}</h3><p class="text-[11px] text-white/40">${c.desc}</p><p class="font-black mt-2">R$ ${c.preco.toFixed(2)}</p></div></div>`}).join('');}
window.openM=(i)=>{detalhe=cardapio[i];adds=[];document.getElementById('mFoto').src=detalhe.foto;document.getElementById('mNome').textContent=detalhe.nome;document.getElementById('mDesc').textContent=detalhe.desc;document.getElementById('mPrecoBase').textContent='R$ '+detalhe.preco.toFixed(2);document.getElementById('mAdds').innerHTML=extras.map((e,j)=>`<label class="flex justify-between bg-white/5 p-3 rounded-xl text-sm"><span><input type="checkbox" onchange="toggleA(${j})"> ${e.nome}</span><span class="text-yellow-400">+R$ ${e.preco}</span></label>`).join('');calc();document.getElementById('modalLanche').classList.remove('hidden');}
window.toggleA=(j)=>{let e=extras[j];if(adds.find(x=>x.nome==e.nome))adds=adds.filter(x=>x.nome!=e.nome);else adds.push(e);calc();};
function calc(){document.getElementById('mTotal').textContent='R$ '+(detalhe.preco+adds.reduce((s,a)=>s+a.preco,0)).toFixed(2);}
window.closeModal=()=>document.getElementById('modalLanche').classList.add('hidden');
document.getElementById('mAdd').onclick=()=>{if(!mesa){alert('Escaneie QR da mesa');return;}let total=detalhe.preco+adds.reduce((s,a)=>s+a.preco,0);carrinho.push({base:detalhe.nome,foto:detalhe.foto,preco:total,extras:[...adds]});updateCart();closeModal();};
function updateCart(){let total=carrinho.reduce((s,c)=>s+c.preco,0);document.getElementById('sacolaTotal').textContent=`R$ ${total.toFixed(2)} • ${carrinho.length} itens`;document.getElementById('total').textContent='R$ '+total.toFixed(2);document.getElementById('carrinho').innerHTML=carrinho.map((c,i)=>`<div class="flex gap-2 bg-zinc-50 p-3 rounded-2xl mb-2"><img src="${c.foto}" class="w-12 h-12 rounded-xl object-cover"><div class="flex-1"><p class="font-black text-xs">${c.base}</p><p class="text-[10px] text-zinc-500">${c.extras.map(e=>e.nome).join(', ')}</p></div><button onclick="carrinho.splice(${i},1);updateCart()">✕</button></div>`).join('')||'<p class="text-center py-10 text-zinc-400">Sacola vazia</p>';}
document.getElementById('btnVerSacola').onclick=()=>document.getElementById('modalSacola').classList.remove('hidden');window.closeSacola=()=>document.getElementById('modalSacola').classList.add('hidden');
document.getElementById('btnPedir').onclick=async()=>{let nome=document.getElementById('nome').value.trim(),whats=document.getElementById('whats').value.trim();if(!nome||!whats)return alert('Nome e WhatsApp obrigatórios');if(carrinho.length==0)return alert('Sacola vazia');let total=carrinho.reduce((s,c)=>s+c.preco,0);let pedido={id:Date.now().toString(),mesa,cliente:nome,whats,obs:document.getElementById('obs').value,itens:[...carrinho],total,status:'novo',hora:Date.now()};await db.collection('pedidos').doc(pedido.id).set(pedido);carrinho=[];updateCart();closeSacola();alert('✅ Pedido enviado! Mesa '+mesa);};
db.collection('pedidos').orderBy('hora','desc').onSnapshot(s=>{pedidos=s.docs.map(d=>d.data());renderTracking();});
function renderTracking(){if(!mesa)return;let meus=pedidos.filter(p=>p.mesa==mesa&&p.status!='entregue');let wrap=document.getElementById('trackingWrap');if(meus.length==0){wrap.classList.add('hidden');return;}wrap.classList.remove('hidden');document.getElementById('trackMesa').textContent=mesa;document.getElementById('trackList').innerHTML=meus.map(o=>{let step=o.status=='novo'?1:o.status=='preparo'?2:3;return `<div class="bg-white text-black rounded-[16px] p-3"><div class="flex justify-between"><p class="font-black text-xs">#${o.id.slice(-4)} R$ ${o.total.toFixed(2)}</p><p class="text-[10px] bg-black text-white px-2 py-1 rounded-full">${o.status.toUpperCase()}</p></div><div class="flex gap-2 mt-2"><div class="flex-1 h-1 bg-zinc-200 rounded-full ${step>=1?'!bg-yellow-400':''}"></div><div class="flex-1 h-1 bg-zinc-200 rounded-full ${step>=2?'!bg-orange-400':''}"></div><div class="flex-1 h-1 bg-zinc-200 rounded-full ${step>=3?'!bg-green-500':''}"></div></div>${step==3?'<p class="mt-2 bg-green-600 text-white p-2 rounded-xl text-center font-black text-xs">✅ PRONTO! RETIRE NO BALCÃO</p>':''}</div>`}).join('');}
renderMenu();updateCart();
let clicks=0;document.getElementById('logoAdmin').onclick=()=>{clicks++;if(clicks>=5){clicks=0;let s=prompt('Senha admin:');if(s=='1234')location.href='./admin/';else alert('Senha errada');}setTimeout(()=>clicks=0,3000);};
</script></body></html>
