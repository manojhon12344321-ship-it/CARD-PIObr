<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>KDS COMPLETO - BURGER HOUSE</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/9.23.0/firebase-firestore-compat.js"></script>
<style>.atrasado{animation:blink 0.8s infinite} @keyframes blink{0%,100%{background:#dc2626}50%{background:#7f1d1d}}</style>
</head>
<body class="bg-[#050505] text-white">
<header class="sticky top-0 z-30 bg-black border-b border-white/10 p-3 flex justify-between items-center flex-wrap gap-2">
<div class="flex gap-2 items-center"><h1 class="font-black text-[12px]">🔥 KDS • <span id="kdsCount">0</span> • FAT <span id="fatDia">R$ 0,00</span></h1><span id="statusSom" class="text-[8px] bg-red-600 px-2 py-1 rounded-full">🔴 SOM</span></div>
<div class="flex gap-2 items-center flex-wrap"><input id="buscaMesa" placeholder="Buscar mesa" class="bg-zinc-900 px-3 py-2 rounded-full text-xs w-32 outline-none" oninput="renderKDS()"><button onclick="testarSom()" class="bg-white/10 px-3 py-2 rounded-full font-black text-[9px]">🔊</button><button onclick="openQR()" class="bg-yellow-400 text-black px-3 py-2 rounded-full font-black text-xs">🔗 QR</button><button onclick="openPainel()" class="bg-white text-black px-3 py-2 rounded-full font-black text-xs">📺 TV</button><button onclick="openReport()" class="bg-white/10 px-3 py-2 rounded-full font-black text-xs">📊</button></div>
</header>
<div class="grid md:grid-cols-3 h-[calc(100vh-110px)]">
<div class="border-r border-white/10 p-3 overflow-auto"><p class="font-black text-xs text-yellow-400">🟡 RECEBIDOS <span id="cNovos">0</span></p><div id="colNovos" class="grid gap-3 mt-3"></div></div>
<div class="border-r border-white/10 p-3 overflow-auto"><p class="font-black text-xs text-orange-400">🔥 PREPARO <span id="cPreparo">0</span></p><div id="colPreparo" class="grid gap-3 mt-3"></div></div>
<div class="p-3 overflow-auto"><p class="font-black text-xs text-green-400">✅ PRONTO <span id="cPronto">0</span></p><div id="colPronto" class="grid gap-3 mt-3"></div></div>
</div>
<div class="fixed bottom-0 left-0 right-0 bg-black border-t border-white/10 p-2 flex gap-2 items-center flex-wrap text-[10px]"><input id="pixKeyInput" placeholder="Chave PIX" class="bg-zinc-900 p-2 rounded text-xs w-60 outline-none"><button onclick="savePixKey()" class="bg-yellow-400 text-black px-3 py-2 rounded-full font-black text-xs">SALVAR PIX</button><span class="text-white/30">Senha 1234 • 5 cliques na logo do cliente abre aqui • QR por mesa em QR</span></div>
<div id="modalDetalhe" class="hidden fixed inset-0 bg-black/90 z-[100] flex items-center justify-center p-4"><div class="bg-white text-black rounded-[32px] w-full max-w-[560px] max-h-[92vh] overflow-auto"><div id="detalheContent"></div></div></div>
<div id="qrPanel" class="hidden fixed inset-0 bg-black z-[90] p-6 overflow-auto"><div class="max-w-6xl mx-auto"><div class="flex justify-between"><h2 class="font-black text-xl">🔗 QR CODES POR MESA</h2><button onclick="closeQR()" class="bg-white text-black px-4 py-2 rounded-full font-black text-xs">X FECHAR</button></div><div class="mt-6 bg-zinc-900 p-4 rounded-2xl grid md:grid-cols-3 gap-4"><div><p class="text-[10px] text-white/40">LINK BASE</p><input id="baseLink" class="w-full mt-2 bg-black p-3 rounded-xl text-sm outline-none"></div><div><p class="text-[10px] text-white/40">MESAS</p><input id="qtdMesas" type="number" value="10" class="w-full mt-2 bg-black p-3 rounded-xl text-sm outline-none"></div><div class="flex items-end"><button onclick="gerarQRS()" class="w-full bg-yellow-400 text-black py-3 rounded-full font-black text-sm">GERAR</button></div></div><div class="mt-4 flex gap-3"><button onclick="imprimirTodos()" class="bg-white text-black px-6 py-3 rounded-full font-black text-xs">🖨️ IMPRIMIR A4</button><button onclick="baixarLinks()" class="bg-zinc-800 px-6 py-3 rounded-full font-black text-xs">COPIAR LINKS</button></div><div id="qrGrid" class="mt-6 grid md:grid-cols-4 gap-4"></div></div></div>
<div id="painelTV" class="hidden fixed inset-0 bg-black z-50 p-6 flex flex-col"><div class="flex justify-between"><h1 class="font-black text-4xl">📺 PEDIDOS PRONTOS</h1><button onclick="closePainel()" class="bg-white text-black px-6 py-2 rounded-full font-black">FECHAR</button></div><div id="tvGrid" class="flex-1 grid md:grid-cols-3 gap-4 mt-8"></div></div>
<div id="reportPanel" class="hidden fixed inset-0 bg-black z-40 p-6 overflow-auto"><div class="max-w-5xl mx-auto"><div class="flex justify-between"><h2 class="font-black text-2xl">📊 RELATÓRIO</h2><button onclick="closeReport()" class="bg-white text-black px-4 py-2 rounded-full font-black text-xs">X</button></div><div class="grid md:grid-cols-4 gap-4 mt-6"><div class="bg-zinc-900 p-4 rounded-2xl"><p class="text-[10px] text-white/40">FAT</p><p id="repFat" class="font-black text-2xl text-green-400">R$ 0</p></div><div class="bg-zinc-900 p-4 rounded-2xl"><p class="text-[10px] text-white/40">PEDIDOS</p><p id="repPed" class="font-black text-2xl">0</p></div><div class="bg-zinc-900 p-4 rounded-2xl"><p class="text-[10px] text-white/40">TICKET</p><p id="repTicket" class="font-black text-xl">R$ 0</p></div><div class="bg-zinc-900 p-4 rounded-2xl"><p class="text-[10px] text-white/40">TOP</p><p id="repTop" class="font-black text-sm"></p></div></div><div id="repLista" class="mt-6 bg-zinc-900 rounded-2xl p-4"></div></div></div>
<script>
const firebaseConfig = { apiKey: "AIzaSyDfnlWLGHySS42WMOcve1qP-dSH3cF-J50", authDomain: "cardapiobr-be645.firebaseapp.com", projectId: "cardapiobr-be645", storageBucket: "cardapiobr-be645.firebasestorage.app", messagingSenderId: "1013095361613", appId: "1:1013095361613:web:31d58aa9ebda0135110004" };
firebase.initializeApp(firebaseConfig); const db=firebase.firestore();
let pedidos=[]; let pixKey=localStorage.getItem('pixKey')||''; document.getElementById('pixKeyInput').value=pixKey;
let audioCtx=null; let somAtivo=false; let ultimoTotal=0;
function initAudio(){ if(!audioCtx) audioCtx=new (window.AudioContext||window.webkitAudioContext)(); if(audioCtx.state==='suspended') audioCtx.resume(); somAtivo=true; document.getElementById('statusSom').textContent='🟢 SOM ATIVO'; document.getElementById('statusSom').className='text-[8px] bg-green-600 px-2 py-1 rounded-full'; }
function tocarBip(){ if(!somAtivo) return; try{ const o=audioCtx.createOscillator(); const g=audioCtx.createGain(); o.connect(g); g.connect(audioCtx.destination); o.frequency.value=880; g.gain.setValueAtTime(1,audioCtx.currentTime); o.start(); g.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); o.stop(audioCtx.currentTime+0.4); setTimeout(()=>{ const o2=audioCtx.createOscillator(); const g2=audioCtx.createGain(); o2.connect(g2); g2.connect(audioCtx.destination); o2.frequency.value=1200; g2.gain.setValueAtTime(1,audioCtx.currentTime); o2.start(); g2.gain.exponentialRampToValueAtTime(0.01,audioCtx.currentTime+0.4); o2.stop(audioCtx.currentTime+0.4); },200); }catch(e){} }
window.testarSom=()=>{ initAudio(); tocarBip(); alert('Som ativo!'); }
document.body.addEventListener('click',()=>{initAudio();},{once:true});
if(prompt('🔒 Senha KDS (1234)')!=='1234'){document.body.innerHTML='<p class="p-10 font-black">Acesso negado</p>';}
db.collection('pedidos').orderBy('hora','desc').onSnapshot(s=>{
  let novos=s.docs.map(d=>d.data());
  if(novos.length>ultimoTotal && ultimoTotal!==0){ tocarBip(); if(Notification && Notification.permission==="granted"){ let ult=novos[0]; new Notification(`🔥 MESA ${ult.mesa} - ${ult.cliente}`); } }
  pedidos=novos; ultimoTotal=pedidos.length; renderKDS(); renderPainel(); renderReport();
});
function renderKDS(){
  let busca=(document.getElementById('buscaMesa').value||'').toLowerCase();
  let colN=document.getElementById('colNovos'), colP=document.getElementById('colPreparo'), colPr=document.getElementById('colPronto');
  colN.innerHTML=''; colP.innerHTML=''; colPr.innerHTML=''; let n=0,p=0,r=0; let fat=0;
  pedidos.forEach(o=>{
    if(o.status=='aguardando_pagamento') return;
    if(busca && !(o.mesa.toString().includes(busca) || o.cliente.toLowerCase().includes(busca))) return;
    fat+=o.total;
    let mins=Math.floor((Date.now()-o.hora)/60000); let atrasado=mins>7;
    let card=`<div onclick="abrirDetalhe('${o.id}')" class="bg-white text-black rounded-[20px] overflow-hidden cursor-pointer ${atrasado&&o.status!='pronto'?'atrasado':''}"><div class="p-3 flex justify-between ${o.status=='novo'?'bg-yellow-400':o.status=='preparo'?'bg-orange-400':'bg-green-400'}"><div><p class="font-black text-sm">MESA ${o.mesa} • ${o.cliente.toUpperCase()}</p><p class="text-[10px] opacity-70">#${o.id.slice(-6)} • ${mins} MIN • R$ ${o.total.toFixed(2)}</p></div><span>👁️</span></div><div class="p-3"><div class="flex gap-1 flex-wrap">${o.itens.map(it=>`<span class="text-[10px] bg-zinc-100 px-2 py-1 rounded-full font-bold">${it.base}</span>`).join('')}</div><p class="text-[10px] mt-2 text-zinc-500">📱 ${o.whats} • ${o.itens.length} itens ${o.obs?'• COM OBS':''}</p></div><div class="px-3 pb-3 grid gap-2" onclick="event.stopPropagation()">${o.status=='novo'?`<button onclick="mudaStatus('${o.id}','preparo')" class="bg-black text-white py-3 rounded-full font-black text-xs">🔥 FAZER</button>`:''}${o.status=='preparo'?`<button onclick="mudaStatus('${o.id}','pronto')" class="bg-green-600 text-white py-3 rounded-full font-black text-xs">✅ PRONTO</button>`:''}${o.status=='pronto'?`<button onclick="mudaStatus('${o.id}','entregue')" class="bg-black text-white py-3 rounded-full font-black text-xs">📦 ENTREGUE</button>`:''}</div></div>`;
    if(o.status=='novo'){colN.innerHTML+=card; n++;} else if(o.status=='preparo'){colP.innerHTML+=card; p++;} else if(o.status=='pronto'){colPr.innerHTML+=card; r++;}
  });
  document.getElementById('cNovos').textContent=n; document.getElementById('cPreparo').textContent=p; document.getElementById('cPronto').textContent=r; document.getElementById('kdsCount').textContent=n+p+r; document.getElementById('fatDia').textContent='R$ '+fat.toFixed(2);
}
window.abrirDetalhe=(id)=>{
  let o=pedidos.find(x=>x.id==id); if(!o) return;
  let mins=Math.floor((Date.now()-o.hora)/60000); let data=new Date(o.hora).toLocaleString('pt-BR');
  document.getElementById('detalheContent').innerHTML=`<div class="p-6"><div class="flex justify-between"><div><p class="text-[10px] font-black text-zinc-400">#${o.id}</p><p class="font-black text-3xl mt-1">MESA ${o.mesa} • ${o.cliente.toUpperCase()}</p><p class="text-xs text-zinc-500">${data} • ${mins} min • ${o.status.toUpperCase()}</p></div><button onclick="fecharDetalhe()" class="w-9 h-9 bg-zinc-100 rounded-full font-black">✕</button></div><div class="grid md:grid-cols-2 gap-3 mt-6"><div class="bg-zinc-50 p-4 rounded-2xl"><p class="text-[10px] font-black text-zinc-400">CLIENTE</p><p class="font-black mt-1">${o.cliente}</p><p class="text-sm mt-1">📱 ${o.whats}</p><a href="https://wa.me/55${o.whats.replace(/\D/g,'')}" target="_blank" class="mt-2 inline-block bg-green-500 text-white px-3 py-1 rounded-full text-xs font-black">WHATSAPP</a></div><div class="bg-zinc-50 p-4 rounded-2xl"><p class="text-[10px] font-black text-zinc-400">PAGAMENTO</p><p class="font-black mt-1">R$ ${o.total.toFixed(2)}</p><p class="text-xs mt-1">Mesa ${o.mesa} • ${o.itens.length} itens</p><p class="text-[10px] mt-2 bg-green-100 text-green-700 px-2 py-1 rounded-full inline-block">✅ PIX PAGO</p></div></div><div class="mt-4"><p class="font-black text-sm">ITENS</p><div class="mt-3 grid gap-2">${o.itens.map(it=>`<div class="flex gap-3 bg-zinc-50 p-3 rounded-2xl"><img src="${it.foto}" class="w-14 h-14 rounded-xl object-cover"><div class="flex-1"><p class="font-black text-sm">${it.base}</p><p class="text-[11px] text-zinc-500">${it.extras?it.extras.map(e=>e.nome).join(', '):''} • R$ ${it.preco.toFixed(2)}</p></div><p class="font-black text-sm">R$ ${it.preco.toFixed(2)}</p></div>`).join('')}</div></div>${o.obs?`<div class="mt-4 bg-red-50 border border-red-200 p-4 rounded-2xl"><p class="font-black text-xs text-red-600">⚠️ OBS:</p><p class="font-bold text-sm mt-1 text-red-700">"${o.obs}"</p></div>`:''}<div class="mt-6 grid gap-2">${o.status=='novo'?`<button onclick="mudaStatus('${o.id}','preparo'); fecharDetalhe()" class="bg-black text-white py-4 rounded-full font-black">🔥 INICIAR PREPARO</button>`:''}${o.status=='preparo'?`<button onclick="mudaStatus('${o.id}','pronto'); fecharDetalhe()" class="bg-green-600 text-white py-4 rounded-full font-black">✅ PRONTO + WHATSAPP</button>`:''}${o.status=='pronto'?`<button onclick="mudaStatus('${o.id}','entregue'); fecharDetalhe()" class="bg-black text-white py-4 rounded-full font-black">📦 ENTREGUE</button>`:''}<button onclick="fecharDetalhe()" class="bg-zinc-100 py-3 rounded-full font-bold text-sm">FECHAR</button></div></div>`;
  document.getElementById('modalDetalhe').classList.remove('hidden');
}
window.fecharDetalhe=()=>document.getElementById('modalDetalhe').classList.add('hidden');
window.mudaStatus=async(id,st)=>{ let p=pedidos.find(x=>x.id==id); if(st=='entregue') await db.collection('pedidos').doc(id).delete(); else await db.collection('pedidos').doc(id).update({status:st}); if(st=='pronto'&&p?.whats){ let msg=`✅ MESA ${p.mesa} ${p.cliente}, seu pedido de R$ ${p.total.toFixed(2)} está PRONTO! Retire no balcão!`; window.open(`https://wa.me/55${p.whats.replace(/\D/g,'')}?text=${encodeURIComponent(msg)}`,'_blank'); }};
window.openQR=()=>{document.getElementById('qrPanel').classList.remove('hidden'); let saved=localStorage.getItem('baseLink')||location.origin+location.pathname.replace('admin/','').replace('admin',''); if(saved) document.getElementById('baseLink').value=saved;};
window.closeQR=()=>document.getElementById('qrPanel').classList.add('hidden');
window.gerarQRS=()=>{
  let base=document.getElementById('baseLink').value.trim() || location.origin+location.pathname.replace('admin/','').replace('admin','');
  localStorage.setItem('baseLink', base); base=base.replace('admin/','').replace('admin','').replace('index.html',''); if(!base.endsWith('/')) base+='/';
  let qtd=parseInt(document.getElementById('qtdMesas').value)||10;
  let grid=document.getElementById('qrGrid'); grid.innerHTML='';
  for(let i=1;i<=qtd;i++){ let link=`${base}?mesa=${i}`; let qrImg=`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(link)}&color=000000&bgcolor=FFCC00`; grid.innerHTML+=`<div class="bg-white text-black rounded-[24px] p-4 text-center"><div class="bg-yellow-400 rounded-full w-8 h-8 grid place-items-center font-black mx-auto">${i}</div><p class="font-black mt-2">MESA ${i}</p><div class="bg-yellow-400 p-3 rounded-2xl mt-3"><img src="${qrImg}" class="w-full bg-white p-2 rounded-xl"><p class="font-black text-[10px] mt-2">BURGER HOUSE</p></div><p class="text-[7px] break-all mt-2 opacity-50">${link}</p><a href="${qrImg}" download="mesa-${i}.png" target="_blank" class="mt-3 bg-black text-white py-2 rounded-full font-black text-[10px] block text-center">BAIXAR PNG</a></div>`; }
};
window.imprimirTodos=()=>{
  let base=localStorage.getItem('baseLink')||location.origin+location.pathname.replace('admin/',''); base=base.replace('admin/','').replace('index.html',''); if(!base.endsWith('/')) base+='/';
  let qtd=parseInt(document.getElementById('qtdMesas').value)||10;
  let html=`<html><head><style>@media print{@page{size:A4}} body{font-family:sans-serif; display:grid; grid-template-columns:1fr 1fr; gap:20px; padding:20px} .card{border:3px dashed #000; border-radius:24px; padding:20px; text-align:center; page-break-inside:avoid} img{width:200px; background:#FFCC00; padding:10px; border-radius:12px}</style></head><body>`;
  for(let i=1;i<=qtd;i++){ let link=`${base}?mesa=${i}`; let qr=`https://api.qrserver.com/v1/create-qr-code/?size=500x500&data=${encodeURIComponent(link)}&color=000000&bgcolor=FFCC00`; html+=`<div class="card"><h1 style="font-size:48px; margin:0">MESA ${i}</h1><img src="${qr}"><p><b>BURGER HOUSE</b><br>Escaneie e peça</p><p style="font-size:9px">${link}</p></div>`; }
  html+=`</body></html>`; let w=window.open('','_blank'); w.document.write(html); w.document.close(); setTimeout(()=>w.print(),500);
};
window.baixarLinks=()=>{ let base=localStorage.getItem('baseLink')||location.origin; base=base.replace('admin/','').replace('index.html',''); if(!base.endsWith('/')) base+='/'; let qtd=parseInt(document.getElementById('qtdMesas').value)||10; let txt=''; for(let i=1;i<=qtd;i++) txt+=`Mesa ${i}: ${base}?mesa=${i}\n`; navigator.clipboard.writeText(txt); alert('Links copiados!'); };
function renderPainel(){ document.getElementById('tvGrid').innerHTML=pedidos.filter(o=>o.status=='pronto').map(o=>`<div class="bg-white text-black rounded-[32px] p-10 text-center animate-pulse"><p class="text-[11px] tracking-widest">PRONTO</p><p class="font-black text-7xl mt-2">MESA ${o.mesa}</p><p class="font-bold text-3xl mt-2">${o.cliente.toUpperCase()}</p></div>`).join('')||'<p class="text-white/20 text-2xl">Nenhum pedido pronto</p>';}
function renderReport(){ let fat=pedidos.reduce((s,p)=>s+p.total,0); document.getElementById('repFat').textContent='R$ '+fat.toFixed(2); document.getElementById('repPed').textContent=pedidos.length; document.getElementById('repTicket').textContent=pedidos.length?'R$ '+(fat/pedidos.length).toFixed(2):'R$ 0,00'; let top={}; pedidos.forEach(p=>p.itens.forEach(it=>{top[it.base]=(top[it.base]||0)+1})); let mais=Object.entries(top).sort((a,b)=>b[1]-a[1])[0]; document.getElementById('repTop').textContent=mais?mais[0]+' ('+mais[1]+'x)':'-'; document.getElementById('repLista').innerHTML=pedidos.map(p=>`<div class="flex justify-between text-xs py-3 border-b border-white/5"><div><p class="font-bold">MESA ${p.mesa} • ${p.cliente} • ${p.whats}</p><p class="text-[10px] text-white/40">${p.itens.map(i=>i.base).join(', ')} ${p.obs?'• OBS: '+p.obs:''}</p></div><span class="font-black">R$ ${p.total.toFixed(2)} • ${p.status}</span></div>`).join('');}
window.openPainel=()=>{document.getElementById('painelTV').classList.remove('hidden'); renderPainel();}; window.closePainel=()=>document.getElementById('painelTV').classList.add('hidden');
window.openReport=()=>{document.getElementById('reportPanel').classList.remove('hidden'); renderReport();}; window.closeReport=()=>document.getElementById('reportPanel').classList.add('hidden');
window.savePixKey=()=>{pixKey=document.getElementById('pixKeyInput').value; localStorage.setItem('pixKey',pixKey); alert('PIX salvo: '+pixKey);};
</script>
</body>
</html>
